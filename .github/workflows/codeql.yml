name: CodeQL

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly scan (Mondays 03:27 UTC) to catch newly-disclosed patterns on unchanged code.
    - cron: '27 3 * * 1'

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # Required to upload results to the Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-and-quality adds maintainability/quality queries on top of the
          # default security suite (closer to the coverage SonarCloud provided).
          queries: security-and-quality

      # Python is interpreted: no build step needed, so autobuild is skipped.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
