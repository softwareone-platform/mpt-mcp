[project]
name = "mpt-mcp"
version = "0.1.0"
description = "Multi-tenant MCP server for the SoftwareOne Marketplace API (stdio + HTTP streamable)"
authors = [{ name = "SoftwareOne AG" }]
readme = "README.md"
license = {text = "Apache-2.0 license"}
requires-python = ">=3.14"
dependencies = [
    "fastmcp==4.1.*",
    "httpx[http2]==0.28.*",
    "python-dotenv==1.2.*",
    "uvicorn==0.40.*",
    "starlette==1.10.*",
    # Analytics
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.31.*",
    "alembic==1.18.*",
    "psycopg2-binary==2.9.*",
    # Auth
    "pyjwt[crypto]==2.15.*",
]

[dependency-groups]
dev = [
    "flake8==7.4.*",
    "flake8-aaa==0.17.*",
    "flake8-pyproject==1.2.*",
    "mypy==2.4.*",
    "pre-commit==4.7.*",
    "pytest==9.0.*",
    "pytest-asyncio==1.3.*",
    "pytest-cov==7.0.*",
    "ruff==0.17.*",
    "wemake-python-styleguide==1.8.*",
]

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = "."
addopts = "--cov=mpt_mcp --cov-report=term-missing --cov-report=xml --import-mode=importlib -ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
]
omit = [
    "*/__init__.py"
]

[tool.flake8]
allowed-domain-names = ["data", "result"]
allowed-module-metadata = ["__all__"]
aaa_act_block_style = "large"
doctests = true
extend-ignore = [
  "WPS226",
  "WPS412",
  # TBD: existing violations (code: count), fixed rule by rule in follow-up commits
  "WPS121",  # 8
  "WPS122",  # 9
  "WPS201",  # 1
  "WPS202",  # 4
  "WPS204",  # 26
  "WPS210",  # 49
  "WPS211",  # 8
  "WPS212",  # 3
  "WPS213",  # 9
  "WPS214",  # 4
  "WPS217",  # 2
  "WPS218",  # 2
  "WPS219",  # 3
  "WPS220",  # 59
  "WPS221",  # 29
  "WPS229",  # 36
  "WPS231",  # 29
  "WPS232",  # 6
  "WPS234",  # 2
  "WPS235",  # 1
  "WPS237",  # 7
  "WPS239",  # 1
  "WPS328",  # 1
  "WPS336",  # 5
  "WPS338",  # 6
  "WPS404",  # 7
  "WPS407",  # 6
  "WPS410",  # 2
  "WPS420",  # 9
  "WPS421",  # 1
  "WPS430",  # 30
  "WPS431",  # 2
  "WPS432",  # 89
  "WPS441",  # 12
  "WPS473",  # 2
  "WPS476",  # 4
  "WPS501",  # 1
  "WPS504",  # 4
  "WPS505",  # 6
  "WPS529",  # 40
  "WPS602",  # 7
]
extend-exclude = [
  ".coverage",
  ".github",
  ".idea",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "uv.lock",
  ".venv",
]
format = "wemake"
max-imports = 17
max-line-length = 100
select = ["AAA", "E999", "WPS"]
show-source = true
statistics = false
per-file-ignores = [
  "*alembic/versions/**:WPS102",
  "*tests/**:WPS202",
]

[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
target-version = "py314"
output-format = "full"
line-length = 100

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # maccabe
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    "ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    "SIM",  # flake8-simpify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "debugger", # flake8-debugger
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "stdlib-module-shadowing",   # allow to shadow stdlib and builtin module names
    "raise-without-from-inside-except",  # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None` to distinguish them from errors in exception handling
    "missing-trailing-comma", # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    "undocumented-public-module",
    "undocumented-public-package",
    "undocumented-magic-method", # docstring for magic methods
    "undocumented-public-nested-class",
    "undocumented-public-init",
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "non-imperative-mood",
    "docstring-starts-with-this",
    "non-capitalized-section-name",
    "single-line-implicit-string-concatenation",  # implicit string concat conflicts with `ruff format`
    "explicit-string-concatenation",  # prefer explicit string concat over implicit concat
    "PLR09",   # we have our own complexity rules
    "magic-value-comparison", # do not report magic numbers
    "no-self-use", # do not require classmethod / staticmethod when self not used
    "pytest-raises-too-broad", # pytest.raises({exception}) is too broad, set the match parameter or use a more specific exception
    "raise-vanilla-args",  # long exception messages from `tryceratops`
    # TBD: existing violations (rule: count), fixed rule by rule in follow-up commits
    "call-datetime-now-without-tzinfo",  # 13
    "complex-structure",  # 22
    "datetime-min-max",  # 1
    "global-statement",  # 18
    "signature-in-docstring",  # 4
    "too-many-nested-blocks",  # 6
    "too-many-statements-in-try-clause",  # 18
    "try-consider-else",  # 11
    "unused-async",  # 5
]
external = [ "AAA", "WPS" ]
# The ℹ️ (information source) emoji is used on purpose in log messages
allowed-confusables = ["ℹ"]

# Plugin configs:
[tool.ruff.lint.flake8-bugbear]
# FastMCP dependency markers are meant to be used as argument defaults
extend-immutable-calls = ["fastmcp.dependencies.CurrentRequest", "fastmcp.dependencies.Depends"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["ast", "datetime"]
aliases = { datetime = "dt" }

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = ["mpt_mcp"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["property"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = [
  "missing-terminal-punctuation", # revision messages are generated by alembic
]
"tests/**/*.py" = [
  "undocumented-public-class", # missing docstring in public class
  "undocumented-public-method", # missing docstring in public method
  "undocumented-public-function", # missing docstring in a public function
  "assert", # asserts
  "hardcoded-password-string", # hardcoded passwords
  "hardcoded-password-func-arg", # fake tokens passed to clients and contexts
  "suspicious-subprocess-import", # subprocess calls are for tests
  "subprocess-without-shell-equals-true", # do not require `shell=True`
  "start-process-with-partial-path", # partial executable paths
  "pytest-fixture-autouse", # autouse fixtures are an accepted pattern in tests
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
enable_error_code = [
  "truthy-bool",
  "truthy-iterable",
  # TBD: "redundant-expr" (6), enable again once fixed
  "unused-awaitable",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-self",
  # TBD: "explicit-override" (6), enable again once fixed
  "mutable-override",
  "unimported-reveal",
  "deprecated",
]
exclude = ["tests"]
exclude_gitignore = true
ignore_missing_imports = true
local_partial_types = true
strict = true
warn_unreachable = true
# TBD: existing violations (code: count), fixed in follow-up commits
disable_error_code = [
  "arg-type",  # 6
  "assignment",  # 6
  "attr-defined",  # 2
  "call-overload",  # 1
  "index",  # 6
  "no-any-return",  # 9
  "no-untyped-call",  # 27
  "no-untyped-def",  # 29
  "operator",  # 1
  "type-arg",  # 12
  "union-attr",  # 4
  "unreachable",  # 2
  "untyped-decorator",  # 10
  "var-annotated",  # 4
]
