[project]
name = "mpt-mcp"
version = "0.1.0"
description = "Multi-tenant MCP server for the SoftwareOne Marketplace API (stdio + HTTP streamable)"
authors = [{ name = "SoftwareOne AG" }]
readme = "README.md"
license = {text = "Apache-2.0 license"}
requires-python = ">=3.14"
dependencies = [
    # Pre-release pinned exactly until the FastMCP 4 upgrade
    "fastmcp==3.0.0b2",
    "httpx[http2]==0.28.*",
    "python-dotenv==1.2.*",
    "uvicorn==0.40.*",
    "starlette==0.52.*",
    # Analytics
    "sqlalchemy[asyncio]==2.0.*",
    "asyncpg==0.31.*",
    "alembic==1.18.*",
    "psycopg2-binary==2.9.*",
    # Auth
    "python-jose[cryptography]==3.5.*",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.*",
    "pytest==9.0.*",
    "pytest-asyncio==1.3.*",
    "pytest-cov==7.0.*",
    "ruff==0.15.*",
]

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = "."
addopts = "--cov=mpt_mcp --cov-report=term-missing --cov-report=xml --import-mode=importlib -ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
]
omit = [
    "*/__init__.py"
]

[tool.ruff]
# Python version
target-version = "py314"

# Line length
line-length = 180

# Enable specific rule sets
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]

# Ignore specific rules
lint.ignore = [
    "UP017", # the alias on UTC, gives me problems in python 3.12
    "PTH",    # flake8-use-pathlib - would require extensive refactoring
    "SIM102", # Use a single if statement instead of nested if statements
    "SIM108", # Use ternary operator instead of if-else-block
    "B904",   # Raise from within except - we intentionally create new exceptions
]

# Exclude directories
extend-exclude = [
    "__pycache__",
    "*.pyc",
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "env",
    ".env",
    "build",
    "dist",
]

# Allow autofix for all enabled rules
lint.fixable = ["ALL"]
lint.unfixable = []

# Allow unused variables when underscore-prefixed
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Test files can have more flexible rules
"tests/**/*.py" = [
    "N802",  # Function name should be lowercase (test methods can use mixed case)
    "N806",  # Variable in function should be lowercase (test fixtures can use mixed case)
    "SIM",   # Simplify rules (tests can be verbose for clarity)
]

[tool.ruff.lint.isort]
# Import sorting configuration
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["mpt_mcp"]

[tool.ruff.format]
# Use double quotes
quote-style = "double"

# Indent with 4 spaces
indent-style = "space"

# Unix line endings
line-ending = "lf"

# Format docstrings
docstring-code-format = true
